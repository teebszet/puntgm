[project]
name = "fantasy-nba-gm"
version = "0.1.0"
description = "AI Co-GM for H2H category fantasy basketball — historical data pipeline + skeleton decision engine + recommendation log."
requires-python = ">=3.11"
dependencies = [
    "nba_api>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
fantasy-gm = "fantasy_gm.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fantasy_gm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
