<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>puntgm — tools</title>
<style>
  :root { --bg:#0d1117; --card:#151b23; --line:#232c38; --ink:#e6edf3;
          --mut:#8b98a8; --good:#4cc38a; --bad:#e06c75; --warn:#e0a458;
          --acc:#4cc38a; --link:#6cb6ff; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         color:var(--ink); background:var(--bg); }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px;
           background:var(--card); border-bottom:1px solid var(--line);
           position:sticky; top:0; z-index:2; }
  header h1 { font-size:16px; margin:0 auto 0 0; }
  header .who { color:var(--mut); font-size:12px; }
  button { font:inherit; padding:5px 12px; border-radius:6px; border:1px solid var(--line);
           background:var(--card); color:var(--ink); cursor:pointer; }
  button.acc { background:var(--acc); border-color:var(--acc); color:#0a1016;
               font-weight:600; }
  main { max-width:1200px; margin:0 auto; padding:14px 16px 60px; }
  nav.tabs { display:flex; gap:6px; margin:4px 0 14px; }
  nav.tabs button { border-radius:999px; }
  nav.tabs button[aria-selected="true"] { background:var(--ink); color:var(--bg);
                                          border-color:var(--ink); }
  .meta { color:var(--mut); font-size:12.5px; margin:0 0 8px; }
  .tscroll { overflow:auto; border:1px solid var(--line); border-radius:8px;
             background:var(--card); }
  table { border-collapse:collapse; width:100%; background:var(--card); }
  th,td { padding:6px 9px; border-bottom:1px solid var(--line); text-align:right;
          white-space:nowrap; font-variant-numeric:tabular-nums; }
  th { font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--mut);
       background:#121a23; position:sticky; top:0; z-index:1; }
  th.l,td.l { text-align:left; }
  tbody tr:hover td { background:#131a22; }
  b.win { color:var(--ink); text-decoration:underline 2px var(--acc); }
  .chip { display:inline-block; padding:1px 8px; border-radius:999px; font-size:11.5px;
          font-weight:600; }
  .chip.safe { background:#12281d; color:var(--good); }
  .chip.live { background:#12233a; color:var(--link); }
  .chip.gone { background:#2d1518; color:var(--bad); }
  .chip.out { background:#2d1518; color:var(--bad); }
  .chip.il  { background:#2a2113; color:var(--warn); }
  .chip.q   { background:#2a2113; color:var(--warn); }
  .bar { position:relative; height:8px; background:#232c38; border-radius:4px;
         min-width:90px; }
  .bar i { position:absolute; inset:0 auto 0 0; border-radius:4px; background:var(--link); }
  .cellcats { display:grid; grid-template-columns:repeat(9,12px); gap:1px; margin-top:2px; }
  .cellcats span { height:10px; border-radius:2px; background:#26303c; }
  .favor { cursor:default; }
  .stick { position:sticky; left:0; background:var(--card); }
  th.stick { z-index:2; background:#121a23; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px;
          padding:10px 12px; margin-bottom:14px; }
  .card .tscroll { border:0; background:transparent; }
  section[hidden] { display:none; }
  .err { color:var(--bad); }
  .foot { color:var(--mut); font-size:12px; margin-top:8px; }
</style>
</head>
<body>
<header>
  <h1>puntgm tools</h1>
  <span class="who" id="who"></span>
  <button id="authbtn" class="acc"></button>
</header>
<main>
  <nav class="tabs" role="tablist">
    <button data-tab="wire" aria-selected="true">Wire lines</button>
    <button data-tab="matchup" aria-selected="false">Matchup</button>
    <button data-tab="grid" aria-selected="false">Fixture grid</button>
    <button data-tab="schedule" aria-selected="false">Schedule grid</button>
    <button data-tab="scoreboard" aria-selected="false">Scoreboard</button>
  </nav>
  <section id="wire"></section>
  <section id="matchup" hidden></section>
  <section id="grid" hidden></section>
  <section id="schedule" hidden></section>
  <section id="scoreboard" hidden></section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dash = (v) => (v === null || v === undefined || v === '') ? '—' : esc(v);

async function api(path) {
  const r = await fetch(path, { credentials: 'include' });
  if (r.status === 401) throw { auth: true };
  if (!r.ok) throw { message: (await r.json()).error || ('HTTP ' + r.status) };
  return r.json();
}

function meUI() {
  return api('/api/auth/me').then(me => {
    if (me.signed_in) {
      $('who').textContent = 'signed in · ' + me.guid;
      $('authbtn').textContent = 'Sign out';
      $('authbtn').onclick = () => location.href = '/api/auth/logout';
    } else {
      $('who').textContent = '';
      $('authbtn').textContent = 'Sign in with Yahoo';
      $('authbtn').onclick = () => location.href = '/api/auth/login';
    }
    return me.signed_in;
  }).catch(() => false);
}

function deny(el, err) {
  el.innerHTML = err && err.auth
    ? '<p class="meta">Sign in with Yahoo to use the tools.</p>'
    : '<p class="err">Failed to load: ' + esc(err && err.message || 'unknown') + '</p>';
}

/* ---- wire lines ------------------------------------------------------ */
async function loadWire() {
  const el = $('wire');
  try {
    const d = await api('/api/tools/wire-lines');
    const slate = d.slate;
    const rows = d.rows.map(r => `<tr>
      <td class="l">${esc(r.name)}</td><td>${esc(r.nba_team)}</td>
      <td>${r.out ? '<span class="chip out">OUT</span>' : dash(r.games_left)}</td>
      <td>${dash(r.minutes)}</td>
      ${['pts','reb','ast','stl','blk','fg3m','tov'].map(c =>
        `<td>${r.beat.includes(c) ? '<b class="win">' + esc(Math.round(r.stats[c])) + '</b>'
                                  : esc(Math.round(r.stats[c]))}</td>`).join('')}
      <td>${dash(r.fg_pct)}</td><td>${dash(r.ft_pct)}</td>
    </tr>`).join('');
    const near = d.near_misses.map(r => `<tr>
      <td class="l">${esc(r.name)}</td><td>${esc(r.nba_team)}</td>
      <td class="l">${esc(r.at.join(', '))}</td>
      <td>${dash(r.minutes)}</td>
      <td>${esc(Math.round(r.stats.pts))}</td><td>${esc(Math.round(r.stats.reb))}</td>
      <td>${esc(Math.round(r.stats.ast))}</td><td>${esc(Math.round(r.stats.stl))}</td>
      <td>${esc(Math.round(r.stats.blk))}</td>
    </tr>`).join('');
    el.innerHTML = `
      <p class="meta">Games of ${esc(d.game_date)} · slate ${slate.games} games,
        ${slate.finals} banked · ${esc(String(d.rostered_count))} rostered, wire =
        everyone else · thresholds strictly more than: &gt;20 pts, &gt;5 ast, &gt;9 reb,
        &gt;2 stl, &gt;2 blk · gm left = his NBA team's scheduled games this week
        (week ${esc(d.week ? d.week.start + ' → ' + d.week.end : 'n/a')})</p>
      <div class="tscroll"><table><thead><tr><th class="l">Player</th><th>NBA</th><th>gm left</th><th>min</th>
        <th>pts</th><th>reb</th><th>ast</th><th>stl</th><th>blk</th><th>3pm</th>
        <th>tov</th><th>fg%</th><th>ft%</th></tr></thead><tbody>${rows}</tbody></table></div>
      <p class="foot">ft% “—” = no free-throw attempts · underlined = beat the threshold</p>
      ${near ? `<p class="meta">Near misses — exactly at a threshold, none beaten:</p>
      <div class="tscroll"><table><thead><tr><th class="l">Player</th><th>NBA</th><th class="l">at</th><th>min</th>
        <th>pts</th><th>reb</th><th>ast</th><th>stl</th><th>blk</th></tr></thead>
        <tbody>${near}</tbody></table></div>` : ''}`;
  } catch (err) { deny(el, err); }
}

/* ---- matchup --------------------------------------------------------- */
async function loadMatchup() {
  const el = $('matchup');
  try {
    const d = await api('/api/tools/matchup');
    const rows = d.categories.map(r => `<tr>
      <td class="l">${esc(r.category)}</td>
      <td><b>${dash(r.mine)}</b> <span style="color:var(--mut)">±${dash(r.mine_std)}
        [${dash(r.mine_lo)}–${dash(r.mine_hi)}]</span></td>
      <td><b>${dash(r.opp)}</b> <span style="color:var(--mut)">±${dash(r.opp_std)}
        [${dash(r.opp_lo)}–${dash(r.opp_hi)}]</span></td>
      <td><div class="bar"><i style="width:${Math.round((r.win_prob) * 100)}%"></i></div></td>
      <td>${Math.round(r.win_prob * 100)}%</td>
      <td><span class="chip ${esc(r.label)}">${esc(r.label)}</span></td>
    </tr>`).join('');
    el.innerHTML = `
      <p class="meta">${esc(d.team_name)} vs ${esc(d.opponent_name)} · week
        ${esc(d.period_start)} → ${esc(d.period_end)} · games remaining:
        ${dash(d.games_remaining.mine)} vs ${dash(d.games_remaining.opp)}
        (Yahoo-comparable: per-day scheduled starters, bench/IL/OUT never count)</p>
      <div class="tscroll"><table><thead><tr><th class="l">Cat</th><th>Yours</th><th>Theirs</th>
        <th></th><th>Win%</th><th>Read</th></tr></thead><tbody>${rows}</tbody></table></div>
      <p class="foot">25th–75th percentile bands from actual per-game σ. A band that
        spans the opponent's number is a coin flip, not a projection — the label
        says which categories are decided.</p>`;
  } catch (err) { deny(el, err); }
}

/* ---- fixture grid ---------------------------------------------------- */
async function loadGrid() {
  const el = $('grid');
  try {
    const d = await api('/api/tools/fixture-grid');
    const cats = d.cats;
    const color = f => f == null ? '#26303c'
      : f > 1.10 ? '#2f9e5b' : f > 1.03 ? '#1d5c38'
      : f < 0.90 ? '#d05a63' : f < 0.97 ? '#6e2a30' : '#313b47';
    const head = `<tr><th class="l">Player</th><th></th><th class="l">Slot</th>` +
      d.dates.map(dt => `<th>${esc(dt.slice(5))}</th>`).join('') + '</tr>';
    const rows = d.players.map(p => `<tr>
      <td class="l">${esc(p.name)} ${p.status
        ? `<span class="chip ${esc(p.status.toLowerCase())}">${esc(p.status)}</span>` : ''}</td>
      <td>${esc(p.nba_team || '')}</td><td class="l">${esc(p.slot)}</td>
      ${d.dates.map(dt => {
        const g = (p.games || []).find(x => x.date === dt);
        if (!g) return '<td style="color:var(--mut)">·</td>';
        const chips = cats.map(c => {
          const f = g.favorability[c];
          const tip = f ? `${c}: ×${f.favor} (rank #${f.rank ?? '?'}, ${f.basis})` : c;
          return `<span class="favor" title="${esc(tip)}" style="background:${color(f && f.favor)}"></span>`;
        }).join('');
        return `<td class="l"><span style="font-size:12px">${esc(g.is_home ? 'vs ' : '@ ')}${esc(g.opponent)}</span>
          <div class="cellcats">${chips}</div></td>`;
      }).join('')}
    </tr>`).join('');
    const legend = `<span style="display:inline-block;width:10px;height:10px;background:#2f9e5b;border-radius:2px"></span> good
      &nbsp;<span style="display:inline-block;width:10px;height:10px;background:#d05a63;border-radius:2px"></span> bad —
      favorability ×league average allowed at that player's position (hover a cell for the number)`;
    el.innerHTML = `
      <p class="meta">Your roster × next ${d.days} days, per-game opponent favorability per
        category. ${legend}</p>
      <div class="tscroll" style="max-height:70vh">
      <table><thead>${head}</thead><tbody>${rows}</tbody></table></div>
      <p class="foot">Basis: ${d.team_games} team-games of 2026-27 box scores
        (${esc(JSON.stringify(d.team_basis || {})).slice(0, 0)}rate cats volume-weighted;
        thin samples fall back to last season).</p>`;
  } catch (err) { deny(el, err); }
}

/* ---- schedule grid (NBA teams × days, Hashtag-style) ----------------- */
async function loadSchedule() {
  const el = $('schedule');
  try {
    const d = await api('/api/tools/schedule-grid');
    const wdOf = dt => ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][
      new Date(dt + 'T12:00:00Z').getUTCDay()];
    const color = f => f == null ? 'transparent'
      : f > 1.06 ? '#1f6f45' : f > 1.02 ? '#1d5c38'
      : f < 0.94 ? '#a83a44' : f < 0.98 ? '#6e2a30' : '#313b47';
    const head = `<tr><th class="l stick">Team</th><th class="stick">G</th>` +
      d.dates.map(dt => `<th>${esc(dt.slice(5))}<br><span style="opacity:.55">${wdOf(dt)}</span></th>`).join('') + '</tr>';
    const lg = `<tr><td class="l stick" style="color:var(--mut)"># games</td>` +
      `<td class="stick" style="color:var(--mut)">${d.league_games_by_date.reduce((a, b) => a + b, 0)}</td>` +
      d.dates.map((dt, i) => `<td style="color:var(--mut)">${d.league_games_by_date[i]}</td>`).join('') + '</tr>';
    const rows = d.teams.map(t => `<tr>
      <td class="l stick">${esc(t.team)}</td><td class="stick"><b>${t.games}</b></td>
      ${d.dates.map(dt => {
        const c = t.cells[dt];
        if (!c) return '<td style="color:var(--mut)">·</td>';
        const tip = Object.entries(c.favor_by_cat).map(([k, v]) => k + ' ×' + v).join(' · ');
        return `<td title="${esc(tip || 'no defense data for this opponent yet')}"
                     style="background:${color(c.favor)}">${c.is_home ? 'vs ' : '@'}${esc(c.opponent)}</td>`;
      }).join('')}</tr>`).join('');
    el.innerHTML = `
      <p class="meta">NBA teams × next ${d.days} days from ${esc(d.as_of)}. Cell tint =
        opponent-defense favorability averaged across all cats (hover = per-cat ×);
        green = soft defense, red = stingy. First row: league slate per day.</p>
      <div class="tscroll" style="max-height:72vh">
      <table><thead>${head}</thead><tbody>${lg}${rows}</tbody></table></div>
      <p class="foot">Defense basis per opponent: 2026-27 team-allowed rates,
        volume-weighted; teams under 5 games price from last season.</p>`;
  } catch (err) { deny(el, err); }
}

/* ---- scoreboard (all-pairs weekly matrix + week selector) ------------- */
const SB = { cache: {} };

function sbRecFor(d, aId, bId) {
  const p = d.pairs.find(x => (x.a === aId && x.b === bId) || (x.b === aId && x.a === bId));
  if (!p) return null;
  const parts = p.record.split('-').map(Number);
  const w = parts[0], l = parts[1], t = parts[2] || 0;
  const rowFirst = p.a === aId;
  return { w: rowFirst ? w : l, l: rowFirst ? l : w, t, real: p.real, pair: p,
           swapped: !rowFirst };
}

function sbMark(cat, av, bv, wp) {
  if (wp !== null) return wp > 50 ? 'W' : wp < 50 ? 'L' : 'T';
  const m = (cat === 'tov' ? -1 : 1) * (av - bv);
  return m > 0 ? 'W' : m < 0 ? 'L' : 'T';
}

function sbShort(s) { return s.length > 18 ? s.slice(0, 17) + '…' : s; }

function sbDetail(d, aId, bId) {
  const rec = sbRecFor(d, aId, bId);
  if (!rec) return '';
  const nameOf = Object.fromEntries(d.teams.map(t => [t.team_id, t.name]));
  const gr = Object.fromEntries(d.teams.map(t => [t.team_id, t.games_remaining]));
  const live = d.status === 'live';
  const A = nameOf[aId], B = nameOf[bId];
  const rows = rec.pair.cats.map(r => {
    const av = rec.swapped ? r.b : r.a, bv = rec.swapped ? r.a : r.b;
    const asd = rec.swapped ? r.b_std : r.a_std, bsd = rec.swapped ? r.a_std : r.b_std;
    const wp = live ? (rec.swapped ? 100 - Math.round(r.win_prob * 100)
                                   : Math.round(r.win_prob * 100)) : null;
    const mark = sbMark(r.category, av, bv, wp);
    return `<tr>
      <td class="l">${esc(r.category)}</td>
      <td><b>${dash(av)}</b>${asd !== undefined ? ' <span style="color:var(--mut)">±' + dash(asd) + '</span>' : ''}</td>
      <td><b>${dash(bv)}</b>${bsd !== undefined ? ' <span style="color:var(--mut)">±' + dash(bsd) + '</span>' : ''}</td>
      <td>${wp === null ? '<span style="color:var(--mut)">—</span>' : wp + '%'}</td>
      <td><b style="color:${mark === 'W' ? 'var(--good)' : mark === 'L' ? 'var(--bad)' : 'var(--mut)'}">${mark}</b></td>
    </tr>`;
  }).join('');
  const grLine = live ? ` · games left: ${dash(gr[aId])} / ${dash(gr[bId])}` : '';
  return `<div class="card" style="margin-top:12px">
    <p class="meta"><b>${esc(A)} vs ${esc(B)}</b> · ${esc(rec.pair.record)}${rec.real ? ' · ◆ real matchup' : ''}${grLine}</p>
    <div class="tscroll"><table><thead><tr><th class="l">Cat</th><th>${esc(sbShort(A))}</th>
      <th>${esc(sbShort(B))}</th><th>win %</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table></div></div>`;
}

function sbRender(d, el) {
  SB.cache[d.week] = d;
  const live = d.status === 'live';
  const source = live
    ? `projected end-of-week totals — banked through ${esc(d.as_of)} + remaining scheduled games · same engine as the Matchup tab`
    : d.source === 'yahoo'
      ? `Yahoo's official weekly totals — platform-scored ground truth`
      : `store banked tallies — Yahoo actuals not stored for this week, roster moves may misattribute`;
  const tint = m => m > 0 ? '#1d5c38' : m < 0 ? '#6e2a30' : '#313b47';
  const head = `<tr><th class="l stick">Week ${d.week}</th>` +
    d.teams.map(t => `<th title="${esc(t.name)}">${esc(sbShort(t.name))}</th>`).join('') + '</tr>';
  const body = d.teams.map(a => `<tr>
    <td class="l stick" title="${esc(a.name)}"><b>${esc(sbShort(a.name))}</b></td>
    ${d.teams.map(b => {
      if (a.team_id === b.team_id) return '<td style="color:var(--mut)">·</td>';
      const rec = sbRecFor(d, a.team_id, b.team_id);
      const m = rec.w - rec.l;
      const label = rec.t ? `${rec.w}-${rec.l}-${rec.t}` : `${rec.w}-${rec.l}`;
      return `<td class="sbcell" data-a="${esc(a.team_id)}" data-b="${esc(b.team_id)}"
        style="background:${tint(m)};cursor:pointer;${rec.real ? 'box-shadow:inset 0 0 0 1px var(--acc);' : ''}"
        title="${esc(a.name)} vs ${esc(b.name)}: ${label}${rec.real ? ' · real matchup' : ''} — click for detail"><b>${label}</b>${rec.real ? ' ◆' : ''}</td>`;
    }).join('')}
  </tr>`).join('');
  const sel = `<select id="sbweek" style="font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px 8px">` +
    d.weeks.map(w => `<option value="${w.week}"${w.week === d.week ? ' selected' : ''}>Week ${w.week}${w.status === 'live' ? ' — current' : ''} · ${esc(w.start.slice(5))}→${esc(w.end.slice(5))}</option>`).join('') +
    `</select>`;
  el.innerHTML = `
    <p class="meta">${sel} &nbsp;·&nbsp; ${source}</p>
    <div class="tscroll"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>
    <div id="sbdetail"></div>
    <p class="foot">Cell = row team's 9-cat record vs column team${live ? ' (from win probabilities)' : ''};
      ◆ = this week's real matchup (accent outline). Click a cell for the per-category table.
      ${live ? 'Live-week cells move with the daily 14:30 snapshot.' : ''}</p>`;
  $('sbweek').onchange = (e) => sbLoad(parseInt(e.target.value, 10), el);
  el.querySelectorAll('td.sbcell').forEach(td => td.onclick = () => {
    $('sbdetail').innerHTML = sbDetail(d, td.dataset.a, td.dataset.b);
  });
}

async function sbLoad(week, el) {
  try {
    const d = SB.cache[week] || await api('/api/tools/scoreboard' + (week ? '?week=' + week : ''));
    sbRender(d, el);
  } catch (err) { deny(el, err); }
}

async function loadScoreboard() {
  await sbLoad(null, $('scoreboard'));
}

/* ---- tabs ------------------------------------------------------------ */
const loaders = { wire: loadWire, matchup: loadMatchup, grid: loadGrid,
                  schedule: loadSchedule, scoreboard: loadScoreboard };
document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav.tabs button').forEach(x =>
    x.setAttribute('aria-selected', x === b));
  document.querySelectorAll('main section').forEach(s => s.hidden = s.id !== b.dataset.tab);
  loaders[b.dataset.tab]();
});

meUI().then(signed => { if (signed) loadWire(); });
</script>
</body>
</html>
